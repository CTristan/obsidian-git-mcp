name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    name: Git preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require Git 2.32 or newer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const output = execFileSync('git', ['version'], { encoding: 'utf8' }).trim();
            const match = output.match(/git version (\d+)\.(\d+)/);
            if (!match || Number(match[1]) < 2 || (Number(match[1]) === 2 && Number(match[2]) < 32)) {
              core.setFailed(`Git 2.32 or newer is required (found: ${output})`);
            }

  test:
    name: Test (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docstrings
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  required:
    # The branch ruleset requires the exact `CI` context, so this job aggregates the matrix.
    name: CI
    if: always()
    needs:
      - preflight
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS to pass
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$MATRIX_RESULT" = success

services:
  docs-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile.docs
    container_name: obsidian-git-mcp-docs
    environment:
      CANARY_ALLOWED_HOSTS: vault-poc.hemocode.dev
      CANARY_BASE_URL: https://vault-poc.hemocode.dev
      CANARY_PORT: "3000"
      OPENAI_APPS_CHALLENGE: ${OPENAI_APPS_CHALLENGE:-}
    ports:
      - "127.0.0.1:3100:3000"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
